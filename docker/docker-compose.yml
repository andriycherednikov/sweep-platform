# =============================================================================
# Sweep Portal — production compose
# =============================================================================
# Pulls pre-built images from GCP Artifact Registry and wires them into the
# shared infrastructure on the server (shared Postgres + shared Caddy). Nothing
# publishes a host port; Caddy reaches the containers by name over the shared
# `simulation-network`.
#
# This stack is deliberately namespaced `portal-*` so it can live beside the
# World Cup app's `sweep-*` stack on the same box, with its own database.
#
# PREREQUISITES (one-time — see README.md):
#   1. `sweep_portal` database created in simulation-postgres.
#   2. .env.docker filled in next to this file on the server.
#   3. gcloud auth configure-docker australia-southeast1-docker.pkg.dev
#   4. The external network `simulation-network` exists.
#   5. caddy/sweep-portal.Caddyfile appended to /root/caddy/Caddyfile + reloaded.
#
# USAGE (on the server, from /root/sweep-portal):
#   docker compose pull && docker compose up -d
# =============================================================================

name: sweep-portal

services:
  # One-shot schema migration. Runs to completion before api/worker start.
  migrate:
    image: australia-southeast1-docker.pkg.dev/formal-triode-465902-n1/sweep/sweep-portal-api:${VERSION:-latest}
    container_name: portal-migrate
    command: ["node", "src/db/migrate.js"]
    env_file:
      - path: .env.docker
        required: true
    restart: "no"
    networks:
      - simulation-network

  api:
    image: australia-southeast1-docker.pkg.dev/formal-triode-465902-n1/sweep/sweep-portal-api:${VERSION:-latest}
    container_name: portal-api
    restart: unless-stopped
    env_file:
      - path: .env.docker
        required: true
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - portal-photos:/data/photos
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - simulation-network

  # Feed worker: daily catalog refresh + baseline/live sync for every active
  # competition across all provisioned sweeps.
  worker:
    image: australia-southeast1-docker.pkg.dev/formal-triode-465902-n1/sweep/sweep-portal-api:${VERSION:-latest}
    container_name: portal-worker
    command: ["node", "src/worker.js"]
    restart: unless-stopped
    env_file:
      - path: .env.docker
        required: true
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - simulation-network

  web:
    image: australia-southeast1-docker.pkg.dev/formal-triode-465902-n1/sweep/sweep-portal-web:${VERSION:-latest}
    container_name: portal-web
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - simulation-network

networks:
  simulation-network:
    external: true
    name: simulation-network

volumes:
  portal-photos:
