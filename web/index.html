<!-- Shared and crawled metadata. One set for the whole SPA: per-page tags would need a
     prerender step, and the marketing pages are the only ones meant to be indexed
     anyway (robots.txt keeps capability links out). Absolute URLs because scrapers do
     not resolve relative ones. -->
<meta name="description" content="Pick a competition, send one link, pull the teams out of the hat. The fixtures, the scores and the ladder look after themselves — right through to the finishing order. $5 a month, two weeks free, no card.">
<link rel="canonical" href="https://sweep-portal.yowiebay.au/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="The Sweep">
<meta property="og:title" content="The Sweep — run a sweep on any competition">
<meta property="og:description" content="Pick a competition, send one link, pull the teams out of the hat. The rest looks after itself.">
<meta property="og:url" content="https://sweep-portal.yowiebay.au/">

<link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900&family=Barlow+Semi+Condensed:wght@500;600;700;800&family=Barlow+Condensed:wght@600;700;800&family=Archivo:wdth,wght@75..125,400..800&family=Caveat:wght@500..700&display=swap" rel="stylesheet">
<script>
  /* Standalone Android PWAs report 100dvh as the full window incl. the system
     gesture bar, so the shell overflows and the bottom nav drops below the fold.
     window.innerHeight excludes that bar — pin the shell to it. Pre-paint to
     avoid a layout jump; visualViewport keeps it correct through keyboard/rotate. */
  (function () {
    var set = function () {
      document.documentElement.style.setProperty('--app-height', window.innerHeight + 'px');
    };
    set();
    window.addEventListener('resize', set);
    window.addEventListener('orientationchange', set);
    if (window.visualViewport) window.visualViewport.addEventListener('resize', set);
  })();
</script>

<body>
  <div id="root">
    <div class="device">
      <div id="appmount" style="height:100%;"></div>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>
